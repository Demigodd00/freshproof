name: FreshProof checks
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'genlayer-test==0.29.2' 'genvm-linter==0.11.0' pytest
      - name: Validate contract and pinned runner
        run: genvm-lint check contracts/FreshProof.py --json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-genvm-v0.2.16
      - name: Prepare pinned GenVM runner
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if python -c "from gltest.direct.sdk_loader import download_artifacts; download_artifacts('v0.2.16')"; then
              exit 0
            fi
            sleep $((attempt * 6))
          done
          exit 1
      - run: python -m pytest tests/direct -q
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm test
        working-directory: site
      - run: pnpm build
        working-directory: site
